<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>805 Showdown</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Arial Black', Impact, Arial, sans-serif;
      user-select: none;
    }
    #canvas-container {
      position: relative;
      width: 1280px;
      height: 720px;
    }
    canvas {
      display: block;
      width: 1280px;
      height: 720px;
    }
    #game-canvas { position: absolute; top: 0; left: 0; }
    #ui-canvas   { position: absolute; top: 0; left: 0; pointer-events: none; }
    #loading {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #050510;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    #loading h1 {
      font-size: 96px; font-weight: 900;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #FF8C00, #FFE000, #FF4500);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #loading p { color: #FF8C00; font-size: 18px; margin-top: 16px; letter-spacing: 4px; }
    #loading .bar-outer {
      width: 320px; height: 6px; background: #222;
      margin-top: 24px; border-radius: 3px; overflow: hidden;
    }
    #loading .bar-fill {
      height: 100%; background: linear-gradient(90deg, #FF8C00, #FFE000);
      border-radius: 3px; animation: load 0.7s ease-out forwards;
    }
    @keyframes load { from { width: 0; } to { width: 100%; } }
    @media (max-width: 1300px) {
      #canvas-container {
        transform: scale(calc(100vw / 1280));
        transform-origin: top center;
      }
    }
    /* Controls overlay */
    #controls-hint {
      position: absolute;
      bottom: 8px; left: 50%;
      transform: translateX(-50%);
      color: #444;
      font-size: 11px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
    <canvas id="ui-canvas"   width="1280" height="720"></canvas>
    <div id="loading">
      <h1>805</h1>
      <p>SHOWDOWN</p>
      <div class="bar-outer"><div class="bar-fill"></div></div>
    </div>
    <div id="controls-hint">
      P1: WASD + G(Light) H(Heavy) J(Sig) K(Shield) &nbsp;|&nbsp;
      P2: Arrows + Num4(Light) Num5(Heavy) Num6(Sig) Num0(Shield) &nbsp;|&nbsp;
      ` = Debug &nbsp; ~ = Hitboxes
    </div>
  </div>
  <script type="module" src="src/game.js"></script>
</body>
</html>
